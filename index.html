<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co;">
  <title>FitDownloads</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./styles/index.css">
  <link rel="stylesheet" href="./styles/loading.css">
  <link rel="stylesheet" href="./styles/auth.css">
  <link rel="stylesheet" href="./styles/dashboard.css">
  <link rel="stylesheet" href="./styles/download.css">
  <link rel="stylesheet" href="./styles/settings.css">
  <link rel="stylesheet" href="./styles/history.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
  <!-- Custom Titlebar -->
  <div id="titlebar">
    <div class="titlebar-drag">
      <div class="titlebar-title">
        <span class="titlebar-icon">⚡</span>
        <span>FITDOWNLOADS</span>
      </div>
    </div>
    <div class="titlebar-controls">
      <button id="btn-minimize" class="titlebar-btn" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
      </button>
      <button id="btn-maximize" class="titlebar-btn" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button id="btn-close" class="titlebar-btn titlebar-btn-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>

  <!-- Canvas for particle effects -->
  <canvas id="particles-canvas"></canvas>

  <!-- Main App Container -->
  <div id="app">
    <!-- Loading Screen -->
    <div id="screen-loading" class="screen active">
      <div class="loading-container">
        <div class="loading-logo" data-text="FITDOWNLOADS">FITDOWNLOADS</div>
        <div class="loading-bar-container">
          <div class="loading-bar"></div>
        </div>
        <div class="loading-subtitle"></div>
      </div>
    </div>

    <!-- Login Screen -->
    <div id="screen-login" class="screen">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-header">
            <h1 class="auth-title">⚡ FITDOWNLOADS</h1>
            <p class="auth-subtitle">Lightning-fast bulk downloads</p>
          </div>
          <div id="auth-form-container">
            <!-- Login Form -->
            <div id="login-form" class="auth-form active">
              <div class="input-group">
                <label for="login-email">EMAIL</label>
                <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
              </div>
              <div class="input-group">
                <label for="login-password">PASSWORD</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
              </div>
              <button id="btn-login" class="btn btn-primary btn-full">LOGIN</button>
              <p class="auth-switch">Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </div>
            <!-- Signup Form -->
            <div id="signup-form" class="auth-form">
              <div class="input-group">
                <label for="signup-name">USERNAME</label>
                <input type="text" id="signup-name" placeholder="GamerTag" autocomplete="username">
              </div>
              <div class="input-group">
                <label for="signup-email">EMAIL</label>
                <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email">
              </div>
              <div class="input-group">
                <label for="signup-password">PASSWORD</label>
                <input type="password" id="signup-password" placeholder="••••••••" autocomplete="new-password">
              </div>
              <button id="btn-signup" class="btn btn-primary btn-full">CREATE ACCOUNT</button>
              <p class="auth-switch">Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>
          </div>
          <div id="auth-error" class="auth-error"></div>
          <div id="auth-success" class="auth-success"></div>
        </div>
        <button id="btn-skip-auth" class="btn btn-ghost">Skip for now (use without account)</button>
      </div>
    </div>

    <!-- Main App (post-login) -->
    <div id="screen-main" class="screen">
      <div class="app-layout">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
          <div class="sidebar-logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">FIT<span class="logo-accent">DL</span></span>
          </div>
          <div class="sidebar-nav">
            <a href="#" class="nav-item active" data-screen="dashboard" id="nav-dashboard">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              </span>
              <span class="nav-label">Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-screen="downloads" id="nav-downloads">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </span>
              <span class="nav-label">Downloads</span>
            </a>
            <a href="#" class="nav-item" data-screen="history" id="nav-history">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </span>
              <span class="nav-label">History</span>
            </a>
            <a href="#" class="nav-item" data-screen="settings" id="nav-settings">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
              </span>
              <span class="nav-label">Settings</span>
            </a>
            <a href="#" class="nav-item" data-screen="profile" id="nav-profile">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <span class="nav-label">Profile</span>
            </a>
          </div>
        </nav>

        <!-- Content Area -->
        <main id="content" class="content">
          <div id="view-dashboard" class="view active"></div>
          <div id="view-downloads" class="view"></div>
          <div id="view-history" class="view"></div>
          <div id="view-settings" class="view"></div>
          <div id="view-profile" class="view"></div>
        </main>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar">
    <div class="status-left">
      <span id="status-network" class="status-indicator">
        <span class="status-dot online"></span>
        <span>Online</span>
      </span>
      <span id="status-downloads" class="status-indicator">
        <span>Ready</span>
      </span>
    </div>
    <div class="status-center">
      <span class="status-credits">Made with love by Yash Arun Bavale</span>
    </div>
    <div class="status-right">
      <span id="status-battery" class="status-indicator">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="10" x2="23" y2="14"/></svg>
        <span id="battery-level">--</span>
      </span>
      <span id="status-time" class="status-indicator"></span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./src/renderer/lib/supabase.js"></script>
  <script src="./src/renderer/lib/utils.js"></script>
  <script src="./src/renderer/components/particles.js"></script>
  <script src="./src/renderer/components/statusBar.js"></script>
  <script src="./src/renderer/components/navbar.js"></script>
  <script src="./src/renderer/components/progressCard.js"></script>
  <script src="./src/renderer/screens/loadingScreen.js"></script>
  <script src="./src/renderer/screens/loginScreen.js"></script>
  <script src="./src/renderer/screens/dashboard.js"></script>
  <script src="./src/renderer/screens/downloadPanel.js"></script>
  <script src="./src/renderer/screens/settings.js"></script>
  <script src="./src/renderer/screens/history.js"></script>
  <script src="./src/renderer/screens/profile.js"></script>
  <script src="./src/renderer/app.js"></script>
</body>
</html>
